<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>TaskFlow</h1>
    <p>Organiza tus tareas fácilmente</p>
  </header>

  <main>
    <section>
      <form id="task-form">
        <label for="task-input">Nueva tarea</label>
        <input
          type="text"
          id="task-input"
          placeholder="Escribe una tarea..."
          required
        />

        <label for="priority-input">Prioridad</label>
        <select id="priority-input">
          <option value="low">Baja</option>
          <option value="medium" selected>Media</option>
          <option value="high">Alta</option>
        </select>

        <button type="submit">Añadir</button>
      </form>

      <div class="filters">
        <button type="button" id="filter-all">Todas</button>
        <button type="button" id="filter-pending">Pendientes</button>
        <button type="button" id="filter-completed">Completadas</button>
      </div>

      <div class="search-box">
        <label for="search-input">Buscar tarea</label>
        <input type="text" id="search-input" placeholder="Buscar tarea..." />
      </div>

      <div class="task-actions">
        <button type="button" id="complete-all-btn">Marcar todas como completadas</button>
        <button type="button" id="clear-completed-btn">Borrar completadas</button>
      </div>

      <section>
        <h2>Tareas</h2>
        <ul id="task-list"></ul>
      </section>
    </section>

    <aside>
      <h2>Estadísticas</h2>
      <p>Total: <span id="total-tasks">0</span></p>
      <p>Completadas: <span id="completed-tasks">0</span></p>
      <p>Pendientes: <span id="pending-tasks">0</span></p>
    </aside>
  </main>

  <footer>
    <p>TaskFlow · Hecho por Roger Sánchez</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
